<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Legend Drive</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050711;color:#fff;font-family:Inter,system-ui,sans-serif}canvas{display:block}#hud{position:fixed;z-index:5;inset:14px 16px auto;display:flex;gap:12px;align-items:center;pointer-events:none}.pill{padding:8px 12px;border:1px solid #ffffff22;border-radius:12px;background:#070a14bb;backdrop-filter:blur(8px);text-shadow:0 2px 8px #000}.pill b{font-size:20px}.right{margin-left:auto;display:flex;gap:8px}.panel{position:fixed;z-index:8;left:18px;bottom:18px;width:min(390px,calc(100vw - 36px));padding:16px;border:1px solid #ffffff20;border-radius:18px;background:#070a12d9;backdrop-filter:blur(14px);box-shadow:0 12px 50px #0008}.row{display:flex;gap:8px;flex-wrap:wrap}.btn,select{border:1px solid #ffffff22;background:#111727;color:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}.btn:hover{background:#1b243a}.title{font-weight:800;font-size:20px;margin-bottom:10px}.sub{opacity:.7;font-size:12px;margin-bottom:10px}.hidden{display:none}.center{position:fixed;z-index:7;inset:0;display:grid;place-items:center;pointer-events:none}.msg{padding:22px 30px;border-radius:18px;background:#050711dd;border:1px solid #ffffff22;text-align:center}.msg h1{margin:0 0 8px;font-size:38px}.msg p{margin:0;opacity:.75}#mobile{position:fixed;z-index:9;right:14px;bottom:18px;display:none;gap:8px}.touch{width:58px;height:58px;border-radius:50%;border:1px solid #ffffff30;background:#090d18bb;color:#fff;font-size:20px}@media(max-width:800px){#mobile{display:flex}.panel{bottom:88px}.pill b{font-size:16px}}</style></head><body><div id="hud"><div class="pill">🏁 <b id="mode">HIGHWAY</b></div><div class="pill">SPEED <b id="speed">0</b></div><div class="pill">DIST <b id="distance">0</b> m</div><div class="pill">SCORE <b id="score">0</b></div><div class="pill">NITRO <b id="nitro">100</b>%</div><div class="right"><div class="pill">🚘 <b id="carName">GTR-X</b></div></div></div><div class="panel"><div class="title" id="title">LEGEND DRIVE</div><div class="sub" id="desc">Neon highway arcade racing</div><div class="row"><select id="lang"><option value="en">English</option><option value="fa">فارسی</option><option value="ar">العربية</option><option value="es">Español</option><option value="tr">Türkçe</option></select><select id="environment"><option value="neon">Neon City</option><option value="day">Highway Day</option><option value="sunset">Sunset</option><option value="desert">Desert</option></select><select id="carSelect"><option value="gtr">GTR-X</option><option value="supra">Supra-R</option><option value="gt">GT-V12</option><option value="rally">Rally-X</option></select></div><div class="row" style="margin-top:8px"><button class="btn" id="camera">Camera C</button><button class="btn" id="traffic">Two Way</button><button class="btn" id="restart">Restart R</button></div></div><div id="mobile"><button class="touch" data-key="ArrowLeft">◀</button><button class="touch" data-key="ArrowUp">▲</button><button class="touch" data-key="ArrowDown">▼</button><button class="touch" data-key="ArrowRight">▶</button><button class="touch" data-key="ShiftLeft">⚡</button></div><div class="center hidden" id="crash"><div class="msg"><h1>CRASH</h1><p>Press R to restart</p></div></div><script type="module" src="game.js?v=40"></script></body></html>
